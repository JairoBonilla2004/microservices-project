# =============================================================================
#  CI/CD Pipeline — Master Gateway
#
#  Arquitectura: DevSecOps + GitOps sobre Kubernetes
#  Ramas:        dev (desarrollo) → test (QA) → main (producción)
#  Tecnologías:  Spring Boot 4 / Java 21, React 19 / TS 6 / Vite 8,
#                SonarCloud, SAST ML (XGBoost + Random Forest),
#                Docker Hub, GitOps (Kustomize), Telegram
#
#  Reglas de protección de rama que este pipeline respeta:
#    - dev, test, main: requieren PR + approvals + status checks + no bypass
#    - dev y main además requieren "Require conversation resolution"
#
#  Consecuencia de diseño:
#    - build-and-test / sonarcloud-scan / sast-ml-scan corren en PR y en push:
#      son los jobs que aparecen como "Status checks" y bloquean el merge.
#    - docker-build-push / gitops-deploy SOLO corren en push (post-merge),
#      nunca en PR, porque publicar imágenes o desplegar desde una rama sin
#      aprobar violaría la intención de las reglas de protección.
# =============================================================================

name: CI/CD Pipeline - Master Gateway

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  SONAR_ORG: ${{ vars.SONAR_ORG || 'jairobonilla2004' }}

permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo PR/rama cuando llega un nuevo push,
# evita gastar minutos de CI en commits ya obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  #  FASE 1 — Build & Test  (status check requerido en PR y push)
  # ===========================================================================
  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend: Java 21 + Maven ---
      - name: Setup Java 21 (Temurin)
        if: matrix.component == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test Backend
        if: matrix.component == 'backend'
        working-directory: master-gateway
        run: mvn -B clean verify

      # --- Frontend: Node 22 + npm ---
      - name: Setup Node 22
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-gateway-front/package-lock.json

      - name: Install Frontend Dependencies
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm ci --frozen-lockfile

      - name: Build Frontend
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm run build

  # ===========================================================================
  #  FASE 2 — Análisis Shift-Left / Calidad (SonarCloud)
  #
  #  CORRECCIÓN: se agrega -Dsonar.qualitygate.wait=true en ambos análisis
  #  (backend y frontend). Sin este flag, el paso de Maven/scanner termina en
  #  éxito aunque el Quality Gate de SonarCloud falle, y el pipeline nunca
  #  se bloquea de verdad — que era justamente lo que se pretendía.
  # ===========================================================================
  sonarcloud-scan:
    name: SonarCloud Quality Gate
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Backend: SonarCloud vía Maven ---
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Compile Backend
        working-directory: master-gateway
        run: mvn -B compile -q

      - name: SonarCloud Backend
        working-directory: master-gateway
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=master-gateway_backend \
            -Dsonar.organization=${{ env.SONAR_ORG }} \
            -Dsonar.exclusions=**/ci/**,**/modelo/** \
            -Dsonar.qualitygate.wait=true

      # --- Frontend: SonarCloud vía sonar-scanner CLI ---
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-gateway-front/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: master-gateway-front
        run: npm ci --frozen-lockfile

      - name: SonarCloud Frontend
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: master-gateway-front
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.exclusions=**/ci/**,**/modelo/**
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===========================================================================
  #  FASE 3 — SAST Avanzado con ML  (status check requerido en PR y push)
  #
  #  CORRECCIÓN: el cálculo de BASE_BRANCH fallaba en el primer push de una
  #  rama nueva, porque github.event.before viene como "000...000" (40 ceros),
  #  un string no vacío, así que el "||" nunca caía a HEAD~1. Se resuelve con
  #  un paso previo que decide el SHA base explícitamente.
  # ===========================================================================
  sast-ml-scan:
    name: SAST ML Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base SHA for diff
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r ci/requirements.txt

      - name: Run Pipeline Unit Tests
        working-directory: ci
        run: python tests.py

      - name: Run ML Security Pipeline
        env:
          BASE_BRANCH: ${{ steps.base.outputs.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODEL_PATH: modelo/model_artifacts
          REPORT_PATH: reports/security_report.json
        run: python ci/security_pipeline.py

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security_report.json
          retention-days: 30

  # ===========================================================================
  #  FASE 4 — Empaquetado y Publicación Docker
  #
  #  Solo corre en push a "dev" — es el único ambiente que existe hoy.
  #  Un push a "test" o "main" sigue pasando por build-and-test, SonarCloud
  #  y SAST (como status checks), pero no publica imagen ni despliega, para
  #  no pisar el manifiesto de dev sin motivo. Cuando existan los ambientes
  #  test/prod, se agrega su propia condición aquí.
  # ===========================================================================
  docker-build-push:
    name: Docker Build & Push
    needs: [sonarcloud-scan, sast-ml-scan]
    if: github.event_name == 'push' && github.ref_name == 'dev'
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Backend image ---
      - name: Build & Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: master-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend image ---
      - name: Build & Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: master-gateway-front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  #  FASE 5 — Despliegue GitOps
  #
  #  Solo corre en push a "dev" (único ambiente existente por ahora).
  #  Las rutas quedan fijas a projects/ms-gateway/*/dev/patch-image.yaml,
  #  igual que en el flujo original. Cuando se creen los ambientes test/prod
  #  en el repo GitOps, este job (y docker-build-push) se pueden extender
  #  con una condición por rama en lugar de estar fijos a "dev".
  # ===========================================================================
  gitops-deploy:
    name: GitOps Deploy
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: JairoBonilla2004/gitops
          token: ${{ secrets.GITOPS_GITHUB_TOKEN }}
          path: gitops

      - name: Configure Git
        working-directory: gitops
        run: |
          git config user.name "GitOps Bot"
          git config user.email "gitops@master-gateway.dev"

      - name: Update Backend Image
        working-directory: gitops
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-backend:${{ github.sha }}|" \
            projects/ms-gateway/backend/dev/patch-image.yaml

      - name: Update Frontend Image
        working-directory: gitops
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-frontend:${{ github.sha }}|" \
            projects/ms-gateway/frontend/dev/patch-image.yaml

      - name: Commit and Push GitOps Changes
        working-directory: gitops
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy: update images to ${{ github.sha }} [skip ci]"
            git push
          fi

  # ===========================================================================
  #  FASE 6 — Notificaciones Telegram
  #
  #  CORRECCIÓN: antes corría con if: always() para CUALQUIER evento,
  #  incluyendo cada push a un PR abierto — es decir, spam de Telegram en
  #  cada commit de una rama de feature todavía en revisión. GitHub ya
  #  muestra el estado de los status checks directamente en el PR, así que
  #  aquí se limita a los eventos "push" (los que de verdad representan un
  #  intento de build/deploy en dev, test o main tras el merge).
  # ===========================================================================
  telegram-notify:
    name: Telegram Notifications
    if: always() && github.event_name == 'push'
    needs:
      - build-and-test
      - sonarcloud-scan
      - sast-ml-scan
      - docker-build-push
      - gitops-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests -q

      - name: Send Pipeline Result Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          _BUILD: ${{ needs.build-and-test.result }}
          _SONAR: ${{ needs.sonarcloud-scan.result }}
          _SAST: ${{ needs.sast-ml-scan.result }}
          _DOCKER: ${{ needs.docker-build-push.result }}
          _DEPLOY: ${{ needs.gitops-deploy.result }}
          _BRANCH: ${{ github.ref_name }}
          _COMMIT: ${{ github.sha }}
          _EVENT: ${{ github.event_name }}
          _REPO: ${{ github.repository }}
          _RUN_ID: ${{ github.run_id }}
          _SERVER_URL: ${{ github.server_url }}
        run: python ci/notify.py