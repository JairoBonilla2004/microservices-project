# =============================================================================
#  CI/CD Pipeline — Master Gateway
#
#  Arquitectura: DevSecOps + GitOps sobre Kubernetes
#  Ramas:        dev (desarrollo) → test (QA) → main (producción)
#  Tecnologías:  Spring Boot 4 / Java 21, React 19 / TS 6 / Vite 8,
#                SonarCloud, SAST ML (XGBoost + Random Forest),
#                Docker Hub, GitOps (Kustomize), Telegram
# =============================================================================

name: CI/CD Pipeline - Master Gateway

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  SONAR_ORG: ${{ vars.SONAR_ORG || 'jairoboni2004' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  #  FASE 1 — Build & Test
  #  Ejecuta en paralelo la compilación y pruebas unitarias del backend
  #  (Maven) y del frontend (npm). Los resultados se cachean para fases
  #  posteriores mediante los mecanismos nativos de GitHub Actions.
  # ===========================================================================
  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend: Java 21 + Maven ---
      - name: Setup Java 21 (Temurin)
        if: matrix.component == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test Backend
        if: matrix.component == 'backend'
        working-directory: master-gateway
        run: mvn -B clean verify

      # --- Frontend: Node 22 + npm ---
      - name: Setup Node 22
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-gateway-front/package-lock.json

      - name: Install Frontend Dependencies
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm ci --frozen-lockfile

      - name: Lint Frontend
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm run lint

      - name: Build Frontend
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm run build

  # ===========================================================================
  #  FASE 2 — Análisis Shift-Left / Calidad (SonarCloud)
  #
  #  Ejecuta SonarCloud sobre ambos proyectos. Requiere que el Quality Gate
  #  pase exitosamente. El análisis solo se realiza si la fase anterior
  #  (build-and-test) fue exitosa.
  #
  #  NOTA: Asegúrate de haber configurado los proyectos en SonarCloud con
  #  los projectKey indicados. El SONAR_TOKEN debe estar en GitHub Secrets.
  # ===========================================================================
  sonarcloud-scan:
    name: SonarCloud Quality Gate
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Backend: SonarCloud vía Maven ---
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Compile Backend
        working-directory: master-gateway
        run: mvn -B compile -q

      - name: SonarCloud Backend
        working-directory: master-gateway
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=master-gateway_backend \
            -Dsonar.organization=${{ env.SONAR_ORG }}

      # --- Frontend: SonarCloud vía sonar-scanner CLI ---
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-gateway-front/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: master-gateway-front
        run: npm ci --frozen-lockfile

      - name: SonarCloud Frontend
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: master-gateway-front
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===========================================================================
  #  FASE 3 — SAST Avanzado con ML
  #
  #  Analiza los cambios del Pull Request usando el modelo ensemble
  #  (RandomForest + XGBoost) entrenado sobre el Juliet Test Suite.
  #
  #  Flujo:
  #    1. Extrae el diff de git (archivos .java modificados)
  #    2. Extrae 29 features estructurales (llamadas peligrosas, sanitización,
  #       complejidad ciclomática, profundidad AST, entropía Shannon, etc.)
  #    3. Vectoriza el código con TF-IDF (n-gramas 1-3)
  #    4. El modelo ensemble predice VULNERABLE / SEGURO
  #    5. Si se detectan vulnerabilidades → exit code 1 (bloquea el pipeline)
  #
  #  Los artefactos del modelo (.joblib) se cargan desde modelo/model_artifacts/
  # ===========================================================================
  sast-ml-scan:
    name: SAST ML Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r ci/requirements.txt

      - name: Run Pipeline Unit Tests
        working-directory: ci
        run: python tests.py

      - name: Run ML Security Pipeline
        env:
          # Para PR: compara PR branch con base branch
          # Para push: compara el push con el commit anterior
          BASE_BRANCH: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODEL_PATH: modelo/model_artifacts
          REPORT_PATH: reports/security_report.json
        run: python ci/security_pipeline.py

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security_report.json
          retention-days: 30

  # ===========================================================================
  #  FASE 4 — Empaquetado y Publicación Docker
  #
  #  Solo se ejecuta en PUSH (no en PRs). Construye las imágenes Docker
  #  para backend y frontend usando Docker Buildx con cache entre builds.
  #  Las imágenes se etiquetan con el SHA completo del commit.
  # ===========================================================================
  docker-build-push:
    name: Docker Build & Push
    needs: [sonarcloud-scan, sast-ml-scan]
    if: github.event_name == 'push'
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Backend image ---
      - name: Build & Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: master-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend image ---
      - name: Build & Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: master-gateway-front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  #  FASE 5 — Despliegue GitOps
  #
  #  Solo se ejecuta en PUSH. Clona el repositorio GitOps y actualiza los
  #  archivos patch-image.yaml de Kustomize con la nueva imagen.
  #
  #  Cómo funciona el comando sed:
  #    El archivo patch-image.yaml contiene una línea con el formato:
  #      image: dockerhubuser/nombre-imagen:tag-anterior
  #
  #    sed -i "s|image:.*|image: NUEVA_IMAGEN|" reemplaza esa línea completa
  #    por la nueva imagen con el SHA actual. El separador "|" evita conflictos
  #    con "/" en la ruta de la imagen.
  #
  #  Rutas actualizadas:
  #    - Backend:  projects/ms-gateway/backend/dev/patch-image.yaml
  #    - Frontend: projects/ms-gateway/frontend/dev/patch-image.yaml
  # ===========================================================================
  gitops-deploy:
    name: GitOps Deploy
    needs: [docker-build-push]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: JairoBonilla2004/gitops
          token: ${{ secrets.GITOPS_GITHUB_TOKEN }}
          path: gitops

      - name: Configure Git
        working-directory: gitops
        run: |
          git config user.name "GitOps Bot"
          git config user.email "gitops@master-gateway.dev"

      # --- Actualizar manifiesto del Backend ---
      # Busca la línea "image:" en el patch y reemplaza todo el valor
      # por la nueva imagen con el SHA del commit actual.
      - name: Update Backend Image
        working-directory: gitops
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-backend:${{ github.sha }}|" \
            projects/ms-gateway/backend/dev/patch-image.yaml

      # --- Actualizar manifiesto del Frontend ---
      - name: Update Frontend Image
        working-directory: gitops
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-frontend:${{ github.sha }}|" \
            projects/ms-gateway/frontend/dev/patch-image.yaml

      - name: Commit and Push GitOps Changes
        working-directory: gitops
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy: update images to ${{ github.sha }} [skip ci]"
            git push
          fi

  # ===========================================================================
  #  FASE 6 — Notificaciones Telegram
  #
  #  Se ejecuta SIEMPRE (incluso si fases anteriores fallan). Envía un resumen
  #  del pipeline con el estado de cada fase: Build & Test, SonarCloud,
  #  SAST ML, Docker Push y GitOps Deploy.
  # ===========================================================================
  telegram-notify:
    name: Telegram Notifications
    if: always()
    needs:
      - build-and-test
      - sonarcloud-scan
      - sast-ml-scan
      - docker-build-push
      - gitops-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests -q

      - name: Send Pipeline Result Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          _BUILD: ${{ needs.build-and-test.result }}
          _SONAR: ${{ needs.sonarcloud-scan.result }}
          _SAST: ${{ needs.sast-ml-scan.result }}
          _DOCKER: ${{ needs.docker-build-push.result }}
          _DEPLOY: ${{ needs.gitops-deploy.result }}
          _BRANCH: ${{ github.ref_name }}
          _COMMIT: ${{ github.sha }}
          _EVENT: ${{ github.event_name }}
          _REPO: ${{ github.repository }}
          _RUN_ID: ${{ github.run_id }}
          _SERVER_URL: ${{ github.server_url }}
        run: python ci/notify.py
