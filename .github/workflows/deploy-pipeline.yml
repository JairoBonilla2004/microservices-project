# =============================================================================
#  Deploy Pipeline — Despliegue real a dev
#
#  Corre SOLO en push a "dev" (es decir, después de que un PR ya pasó por
#  integration-pipeline.yml y fue aprobado y mergeado). Nunca corre desde
#  un PR sin aprobar.
#
#  Vuelve a correr build-and-test + SonarCloud + SAST ML sobre el merge
#  commit (no solo confía en el resultado del PR, porque el merge commit
#  es técnicamente un commit nuevo), y si todo pasa, construye la imagen,
#  actualiza el repo GitOps y notifica por Telegram.
#
#  "dev" es hoy el único ambiente real. Cuando exista un ambiente de
#  producción, se duplica este archivo (ej. deploy-main-pipeline.yml)
#  cambiando la rama disparadora y las rutas de
#  projects/ms-gateway/*/<ambiente>/patch-image.yaml.
# =============================================================================

name: Deploy Pipeline (dev)

on:
  push:
    branches: [dev]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  SONAR_ORG: ${{ vars.SONAR_ORG || 'jairobonilla2004' }}

permissions:
  contents: read

# No se cancela un deploy en curso aunque llegue otro push — evita dejar
# una imagen a medio publicar o un manifiesto de GitOps a medio actualizar.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # ===========================================================================
  #  FASE 1 — Build & Test (revalidación del merge commit)
  # ===========================================================================
  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        if: matrix.component == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test Backend
        if: matrix.component == 'backend'
        working-directory: master-gateway
        run: mvn -B clean verify

      - name: Upload Backend Build Output
        if: matrix.component == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: master-gateway/target
          retention-days: 1

      - name: Setup Node 22
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-gateway-front/package-lock.json

      - name: Install Frontend Dependencies
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm ci --frozen-lockfile

      - name: Build Frontend
        if: matrix.component == 'frontend'
        working-directory: master-gateway-front
        run: npm run build

  # ===========================================================================
  #  FASE 2 — SonarCloud Quality Gate
  #
  #  OPTIMIZACIÓN: reutiliza el target/ ya compilado en build-and-test en
  #  vez de recompilar. Nota a futuro: si agregas DAST o pruebas E2E
  #  completas, NO van aquí — van después de gitops-deploy, corriendo
  #  contra el ambiente ya desplegado, no contra código sin desplegar.
  # ===========================================================================
  sonarcloud-scan:
    name: SonarCloud Quality Gate
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      error: ${{ steps.capture-error.outputs.error || '' }}
      coverage: ${{ steps.coverage.outputs.coverage || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Build Output
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: master-gateway/target

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: SonarCloud Backend
        id: sonar-backend
        working-directory: master-gateway
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=master-gateway_backend \
            -Dsonar.organization=${{ env.SONAR_ORG }} \
            -Dsonar.exclusions=**/ci/**,**/modelo/** \
            -Dsonar.qualitygate.wait=true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-gateway-front/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: master-gateway-front
        run: npm ci --frozen-lockfile

      - name: SonarCloud Frontend
        id: sonar-frontend
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: master-gateway-front
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.exclusions=**/ci/**,**/modelo/**
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Capture Sonar Error
        id: capture-error
        if: always()
        run: |
          if [ "${{ steps.sonar-backend.conclusion }}" = "failure" ]; then
            echo "error=SonarCloud Backend: quality gate no superada" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.sonar-frontend.conclusion }}" = "failure" ]; then
            echo "error=SonarCloud Frontend: quality gate no superada" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Frontend Coverage
        id: coverage
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
        run: |
          COV=$(curl -s -u "${{ secrets.SONAR_TOKEN }}": \
            "https://sonarcloud.io/api/measures/component?component=master-gateway-frontend&metricKeys=coverage" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['component']['measures'][0]['value'])" 2>/dev/null || echo "?")
          echo "coverage=${COV}%" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  #  FASE 3 — SAST Avanzado con ML
  #
  #  En push, BASE_BRANCH se compara contra el commit inmediatamente
  #  anterior en dev (github.event.before). En el primer push histórico a
  #  dev ese valor viene en ceros, por eso el fallback explícito a HEAD~1.
  # ===========================================================================
  sast-ml-scan:
    name: SAST ML Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base SHA for diff
        id: base
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r ci/requirements.txt

      - name: Run Pipeline Unit Tests
        working-directory: ci
        run: python tests.py

      - name: Run ML Security Pipeline
        env:
          BASE_BRANCH: ${{ steps.base.outputs.sha }}
          HEAD_BRANCH: ${{ github.sha }}
          GITHUB_PR_NUMBER: ''
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODEL_PATH: modelo/model_artifacts
          REPORT_PATH: reports/security_report.json
        run: python ci/security_pipeline.py

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security_report.json
          retention-days: 30

  # ===========================================================================
  #  FASE 4 — Empaquetado y Publicación Docker
  # ===========================================================================
  docker-build-push:
    name: Docker Build & Push
    needs: [sonarcloud-scan, sast-ml-scan]
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: master-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: master-gateway-front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  #  FASE 5 — Despliegue GitOps
  #
  #  Rutas fijas a dev — es el único ambiente que existe hoy.
  # ===========================================================================
  gitops-deploy:
    name: GitOps Deploy
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: JairoBonilla2004/gitops
          token: ${{ secrets.GITOPS_GITHUB_TOKEN }}
          path: gitops

      - name: Configure Git
        working-directory: gitops
        run: |
          git config user.name "GitOps Bot"
          git config user.email "gitops@master-gateway.dev"

      - name: Update Backend Image
        working-directory: gitops
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-backend:${{ github.sha }}|" \
            projects/ms-gateway/backend/dev/patch-image.yaml

      - name: Update Frontend Image
        working-directory: gitops
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/master-gateway-frontend:${{ github.sha }}|" \
            projects/ms-gateway/frontend/dev/patch-image.yaml

      - name: Commit and Push GitOps Changes
        working-directory: gitops
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy: update images to ${{ github.sha }} [skip ci]"
            git push
          fi

  # ===========================================================================
  #  FASE 6 — Notificaciones Telegram
  # ===========================================================================
  telegram-notify:
    name: Telegram Notifications
    if: always()
    needs:
      - build-and-test
      - sonarcloud-scan
      - sast-ml-scan
      - docker-build-push
      - gitops-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests -q

      - name: Send Pipeline Result Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          _BUILD: ${{ needs.build-and-test.result }}
          _SONAR: ${{ needs.sonarcloud-scan.result }}
          _SAST: ${{ needs.sast-ml-scan.result }}
          _DOCKER: ${{ needs.docker-build-push.result }}
          _DEPLOY: ${{ needs.gitops-deploy.result }}
          _SONAR_ERROR: ${{ needs.sonarcloud-scan.outputs.error }}
          _COVERAGE: ${{ needs.sonarcloud-scan.outputs.coverage }}
          _BRANCH: ${{ github.ref_name }}
          _COMMIT: ${{ github.sha }}
          _EVENT: ${{ github.event_name }}
          _REPO: ${{ github.repository }}
          _RUN_ID: ${{ github.run_id }}
          _SERVER_URL: ${{ github.server_url }}
        run: python ci/notify.py