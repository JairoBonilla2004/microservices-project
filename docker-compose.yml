# =============================================================================
#  Variables de Entorno — master-gateway (Docker Compose)
#
#  Archivo de configuración de variables de entorno para la ejecución del
#  proyecto Master Gateway mediante Docker Compose.
#
#  Los valores obligatorios deben definirse antes de iniciar los servicios.
#
#  Para generar un valor seguro para JWT_SECRET:
#      openssl rand -base64 48
#
#  Autores:
#    - Jairo Bonilla
#    - Reishel Tipán
#    - Julio Viche
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  Base de datos — PostgreSQL 17
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: master-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-master_gateway}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-master_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  #  API Gateway — Spring Boot
  # ---------------------------------------------------------------------------
  master-gateway:
    build:
      context: ./master-gateway
      dockerfile: Dockerfile
    container_name: master-gateway-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # --- Perfil activo ----------------------------------------------------
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # --- Base de datos: convención Spring Boot (SPRING_DATASOURCE_*) ------
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-master_gateway}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}

      # --- Fallback: alias cortos (para arranque manual sin Spring convention)
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-master_gateway}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # --- Pool HikariCP ----------------------------------------------------
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-5}

      # --- JPA / Hibernate --------------------------------------------------
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      DDL_AUTO: ${DDL_AUTO:-validate}
      SHOW_SQL: ${SHOW_SQL:-false}

      # --- JWT --------------------------------------------------------------
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_MODE: ${JWT_MODE:-direct}

      # --- Admin seed -------------------------------------------------------
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}

      # --- Logging ----------------------------------------------------------
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}

      # --- Password policy --------------------------------------------------
      HASH_ALGORITHM: ${HASH_ALGORITHM:-argon2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  Frontend — React + Nginx
  # ---------------------------------------------------------------------------
  master-gateway-front:
    build:
      context: ./master-gateway-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        API_PROXY_PASS: ${API_PROXY_PASS:-http://master-gateway:8080}
    container_name: master-gateway-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-80}:80"
    depends_on:
      master-gateway:
        condition: service_healthy

# ---------------------------------------------------------------------------
#  Volúmenes persistentes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
