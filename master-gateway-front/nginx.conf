# =============================================================================
#  nginx.conf — master-gateway-front
#
#  Servidor de contenido estático para SPA en React + TypeScript.
#  Incluye: proxy reverso hacia la API, redirección SPA, cabeceras de
#  seguridad, compresión GZip, cacheo de assets y protección contra
#  ataques comunes.
#
#  El placeholder __API_PROXY_PASS__ se reemplaza en tiempo de build
#  por la URL del backend (ver Dockerfile build arg API_PROXY_PASS).
#
#  Autores:
#    - Jairo Bonilla
#    - Julio Viche
#    - Reishel Tipán
# =============================================================================

server {
    listen 80;
    server_name _; # _ es un comodín para cualquier host que llegue a este servidor ej http://localhost:8080, http://mydomain.com, etc.

    # --- Raíz del sitio ---
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    #  Cabeceras de seguridad (Security Headers)
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Ajustar connect-src si la API está en un dominio diferente al del frontend
    # Ejemplo: connect-src 'self' https://api.mi-dominio.com
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

    # -----------------------------------------------------------------------
    #  Compresión GZip / Brotli
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # -----------------------------------------------------------------------
    #  Proxy reverso — API Gateway
    #  Las peticiones /api/* se redirigen al backend.
    #  __API_PROXY_PASS__ se reemplaza en build (default: http://master-gateway:8080)
    # -----------------------------------------------------------------------
    # IMPORTANTE: Sin barra al final — con barra nginx STRIPPEARÍA el prefijo
    # /api de la URI, enviando /auth/login en vez de /api/auth/login.
    # El backend espera /api/* completo.
    location /api/ {
        proxy_pass __API_PROXY_PASS__;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Forwarded-Port        $server_port;
        proxy_read_timeout    90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout    90s;
        proxy_buffering       off;
    }

    # -----------------------------------------------------------------------
    #  SPA — Redirigir todas las rutas a index.html
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cacheo del HTML: nunca cachear (siempre servirlo fresco)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }

    # -----------------------------------------------------------------------
    #  Assets estáticos con hash en el nombre → cacheo perpetuo
    # -----------------------------------------------------------------------
    location ~* \.(?:js|css|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -----------------------------------------------------------------------
    #  Assets sin hash (imágenes, fuentes) → cacheo moderado
    # -----------------------------------------------------------------------
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # -----------------------------------------------------------------------
    #  Negar acceso a archivos sensibles
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (?:\.env|\.git|package\.json|tsconfig.*)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
