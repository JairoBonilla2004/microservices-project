# =============================================================================
#  Perfil: dev — Desarrollo local
#
#  Usar con: --spring.profiles.active=dev (o env SPRING_PROFILES_ACTIVE=dev)
#
#  Características:
#    - DDL: update     → Hibernate sincroniza el esquema automáticamente
#    - SQL formateado  → show-sql + format_sql para depuración
#    - Logs DEBUG/TRACE→ Traza completa de Hibernate y la aplicación
#    - Pool mínimo     → Conexiones reducidas para entorno local
#
#  Autores:
#    - Jairo Bonilla
#    - Julio Viche
#    - Reishel Tipán
# =============================================================================

spring:
  jpa:
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:true}

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}

logging:
  level:
    root: ${LOG_LEVEL:DEBUG}
    ec.edu.espe.master_gateway: ${GATEWAY_LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_BINDER_LOG_LEVEL:TRACE}
